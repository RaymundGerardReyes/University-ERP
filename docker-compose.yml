x-portal-deploy: &portal-deploy
  restart: "no"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
  networks:
    - erp-internal

services:
  postgres:
    image: postgres:16-alpine
    container_name: universityerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      # Expose internally to the bridge network instead of publishing to the host
      - "5432"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-internal

  migrator:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Migrator/Dockerfile
    container_name: universityerp-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    networks:
      - erp-internal

  postgres-backup:
    build:
      context: ./University-ERP-Backend/ops/db
      dockerfile: Dockerfile.backup
    container_name: universityerp-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      APP_VERSION: ${APP_VERSION:-latest}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - pgbackups_local:/backups
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - erp-internal

  api:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Api/Dockerfile
    container_name: universityerp-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ASPNETCORE_URLS: "http://0.0.0.0:${INTERNAL_API_PORT:-5191}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PaymentGateway__SecretKey: ${PaymentGateway__SecretKey:-${PAYMENT_GATEWAY_SECRET_KEY:-sk_test_mocked}}
      PaymentGateway__WebhookSecret: ${PaymentGateway__WebhookSecret:-whsec_mocked}
      PaymentGateway__WebhookUrl: ${PaymentGateway__WebhookUrl:-}
      PaymentGateway__SuccessUrl: ${PaymentGateway__SuccessUrl:-}
      PaymentGateway__CancelUrl: ${PaymentGateway__CancelUrl:-}
      PaymentGateway__BaseUrl: ${PaymentGateway__BaseUrl:-}
      PaymentGateway__SourceAccountId: ${PaymentGateway__SourceAccountId:-}
    expose:
      - "${INTERNAL_API_PORT:-5191}"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:${INTERNAL_API_PORT:-5191}/health/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      erp-internal:
        aliases:
          - api.university.edu

  worker:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Worker/Dockerfile
    container_name: universityerp-worker
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PaymentGateway__SecretKey: ${PaymentGateway__SecretKey:-${PAYMENT_GATEWAY_SECRET_KEY:-sk_test_mocked}}
      PaymentGateway__WebhookSecret: ${PaymentGateway__WebhookSecret:-whsec_mocked}
      PaymentGateway__WebhookUrl: ${PaymentGateway__WebhookUrl:-}
      PaymentGateway__SuccessUrl: ${PaymentGateway__SuccessUrl:-}
      PaymentGateway__CancelUrl: ${PaymentGateway__CancelUrl:-}
      PaymentGateway__BaseUrl: ${PaymentGateway__BaseUrl:-}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - erp-internal

  frontend-builder:
    <<: *portal-deploy
    container_name: universityerp-frontend-builder
    build:
      context: ./University-ERP-Frontend
      dockerfile: Dockerfile.build-all
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY:-}
        VITE_IDENTITY_PORTAL_URL: ${VITE_IDENTITY_PORTAL_URL:-}
        VITE_STUDENT_PORTAL_URL: ${VITE_STUDENT_PORTAL_URL:-}
        VITE_APPLICANT_PORTAL_URL: ${VITE_APPLICANT_PORTAL_URL:-}
        VITE_FACULTY_PORTAL_URL: ${VITE_FACULTY_PORTAL_URL:-}
        VITE_FINANCE_CONSOLE_URL: ${VITE_FINANCE_CONSOLE_URL:-}
        VITE_GOVERNANCE_CONSOLE_URL: ${VITE_GOVERNANCE_CONSOLE_URL:-}
        VITE_ADMIN_PORTAL_URL: ${VITE_ADMIN_PORTAL_URL:-}
        VITE_LIBRARY_PORTAL_URL: ${VITE_LIBRARY_PORTAL_URL:-}
        VITE_LMS_WEB_URL: ${VITE_LMS_WEB_URL:-}
        VITE_REGISTRAR_PORTAL_URL: ${VITE_REGISTRAR_PORTAL_URL:-}
        VITE_SECURITY_PORTAL_URL: ${VITE_SECURITY_PORTAL_URL:-}
        VITE_ADMISSIONS_PORTAL_URL: ${VITE_ADMISSIONS_PORTAL_URL:-}
        VITE_PAYMENT_GATEWAY_URL: ${VITE_PAYMENT_GATEWAY_URL:-}
        VITE_PLATFORM_CONSOLE_URL: ${VITE_PLATFORM_CONSOLE_URL:-}
    volumes:
      - identity_dist:/output/identity-portal
      - student_dist:/output/student-portal
      - faculty_dist:/output/faculty-portal
      - admin_dist:/output/admin-portal
      - lms_dist:/output/lms-web
      - finance_dist:/output/finance-console
      - library_dist:/output/library-portal
      - governance_dist:/output/governance-console
      - platform_dist:/output/platform-console
      - applicant_dist:/output/applicant-portal
      - admissions_dist:/output/admissions-portal
      - registrar_dist:/output/registrar-portal
      - security_dist:/output/security-portal
      - payment_dist:/output/payment-gateway

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: universityerp-cloudflared
    restart: unless-stopped
    user: "65532:65532"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_EDGE_BIND_ADDRESS=0.0.0.0
      - TUNNEL_TRANSPORT_PROTOCOL=http2
      - TUNNEL_ORIGIN_SERVER_NAME=universityerp-nginx
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate --retries 5 --grace-period 15s run
    networks:
      - erp-internal

  alloy:
    image: grafana/alloy:v1.2.0
    container_name: universityerp-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./University-ERP-Backend/ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
    networks:
      - erp-internal
    depends_on:
      - loki

  loki:
    image: grafana/loki:2.9.2
    container_name: universityerp-loki
    restart: unless-stopped
    user: "root"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./University-ERP-Backend/ops/observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
    networks:
      - erp-internal

  grafana:
    image: grafana/grafana:11.0.0
    container_name: universityerp-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 250M
    networks:
      - erp-internal
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: universityerp-nginx
    restart: unless-stopped
    environment:
      - DOMAIN_IDENTITY=${DOMAIN_IDENTITY:-identity.developerph.dev}
      - DOMAIN_STUDENT=${DOMAIN_STUDENT:-student.developerph.dev}
      - DOMAIN_APPLICANT=${DOMAIN_APPLICANT:-applicant.developerph.dev}
      - DOMAIN_FACULTY=${DOMAIN_FACULTY:-faculty.developerph.dev}
      - DOMAIN_FINANCE=${DOMAIN_FINANCE:-finance.developerph.dev}
      - DOMAIN_GOVERNANCE=${DOMAIN_GOVERNANCE:-governance.developerph.dev}
      - DOMAIN_ADMIN=${DOMAIN_ADMIN:-admin.developerph.dev}
      - DOMAIN_LIBRARY=${DOMAIN_LIBRARY:-library.developerph.dev}
      - DOMAIN_LMS=${DOMAIN_LMS:-lms.developerph.dev}
      - DOMAIN_PLATFORM=${DOMAIN_PLATFORM:-platform.developerph.dev}
      - DOMAIN_PORTAL=${DOMAIN_PORTAL:-portal.developerph.dev}
      - DOMAIN_ADMISSIONS=${DOMAIN_ADMISSIONS:-admissions.developerph.dev}
      - DOMAIN_REGISTRAR=${DOMAIN_REGISTRAR:-registrar.developerph.dev}
      - DOMAIN_SECURITY=${DOMAIN_SECURITY:-security.developerph.dev}
      - DOMAIN_PAYMENT=${DOMAIN_PAYMENT:-payment.developerph.dev}
      - DOMAIN_API=${API_PUBLIC_DOMAIN:-api.developerph.dev}
      - API_INTERNAL_PORT=${PORT_API:-5191}
    command:
      - /bin/sh
      - -c
      - |
        cp -r /tmp/nginx_config/* /etc/nginx/

        sed -i "s|__IDENTITY_DOMAIN__|$$DOMAIN_IDENTITY|g" /etc/nginx/sites-available/auth.university.edu.conf
        sed -i "s|__STUDENT_DOMAIN__|$$DOMAIN_STUDENT|g" /etc/nginx/sites-available/student.university.edu.conf
        sed -i "s|__APPLICANT_DOMAIN__|$$DOMAIN_APPLICANT|g" /etc/nginx/sites-available/applicant.university.edu.conf
        sed -i "s|__FACULTY_DOMAIN__|$$DOMAIN_FACULTY|g" /etc/nginx/sites-available/faculty.university.edu.conf
        sed -i "s|__FINANCE_DOMAIN__|$$DOMAIN_FINANCE|g" /etc/nginx/sites-available/finance.university.edu.conf
        sed -i "s|__GOVERNANCE_DOMAIN__|$$DOMAIN_GOVERNANCE|g" /etc/nginx/sites-available/governance.university.edu.conf
        sed -i "s|__ADMIN_DOMAIN__|$$DOMAIN_ADMIN|g" /etc/nginx/sites-available/admin.university.edu.conf
        sed -i "s|__LIBRARY_DOMAIN__|$$DOMAIN_LIBRARY|g" /etc/nginx/sites-available/library.university.edu.conf
        sed -i "s|__LMS_DOMAIN__|$$DOMAIN_LMS|g" /etc/nginx/sites-available/lms.university.edu.conf
        sed -i "s|__PLATFORM_DOMAIN__|$$DOMAIN_PLATFORM|g" /etc/nginx/sites-available/platform.university.edu.conf
        sed -i "s|__ADMISSIONS_DOMAIN__|$$DOMAIN_ADMISSIONS|g" /etc/nginx/sites-available/admissions.university.edu.conf
        sed -i "s|__REGISTRAR_DOMAIN__|$$DOMAIN_REGISTRAR|g" /etc/nginx/sites-available/registrar.university.edu.conf
        sed -i "s|__SECURITY_DOMAIN__|$$DOMAIN_SECURITY|g" /etc/nginx/sites-available/security.university.edu.conf
        sed -i "s|__PAYMENT_DOMAIN__|$$DOMAIN_PAYMENT|g" /etc/nginx/sites-available/payment.university.edu.conf
        sed -i "s|__API_DOMAIN__|$$DOMAIN_API|g" /etc/nginx/sites-available/api.university.edu.conf
        sed -i "s|__PORTAL_DOMAIN__|$$DOMAIN_PORTAL|g" /etc/nginx/sites-available/portal.university.edu.conf

        sed -i "s|__API_INTERNAL_PORT__|$$API_INTERNAL_PORT|g" /etc/nginx/nginx.conf /etc/nginx/snippets/*.conf /etc/nginx/sites-available/*.conf

        export ALL_VALID_DOMAINS="$$DOMAIN_IDENTITY $$DOMAIN_STUDENT $$DOMAIN_APPLICANT $$DOMAIN_FACULTY $$DOMAIN_FINANCE $$DOMAIN_GOVERNANCE $$DOMAIN_ADMIN $$DOMAIN_LIBRARY $$DOMAIN_LMS $$DOMAIN_PLATFORM $$DOMAIN_PORTAL $$DOMAIN_ADMISSIONS $$DOMAIN_REGISTRAR $$DOMAIN_SECURITY $$DOMAIN_PAYMENT $$DOMAIN_API"
        sed -i "s|__ALL_VALID_DOMAINS__|$$ALL_VALID_DOMAINS|g" /etc/nginx/nginx.conf

        sed -i "s|__IDENTITY_PORTAL_URL__|http://$$DOMAIN_IDENTITY|g" /etc/nginx/snippets/auth-request.conf
        sed -i "s|__PLATFORM_CONSOLE_URL__|http://$$DOMAIN_PLATFORM|g" /etc/nginx/sites-available/portal.university.edu.conf
        
        nginx -g "daemon off;"
    ports:
      - "${PORT_IDENTITY:?PORT_IDENTITY must be defined}:8081"
      - "${PORT_STUDENT:?PORT_STUDENT must be defined}:5173"
      - "${PORT_APPLICANT:?PORT_APPLICANT must be defined}:5174"
      - "${PORT_FACULTY:?PORT_FACULTY must be defined}:5175"
      - "${PORT_FINANCE:?PORT_FINANCE must be defined}:5176"
      - "${PORT_GOVERNANCE:?PORT_GOVERNANCE must be defined}:5177"
      - "${PORT_ADMIN:?PORT_ADMIN must be defined}:5178"
      - "${PORT_LIBRARY:?PORT_LIBRARY must be defined}:5179"
      - "${PORT_LMS:?PORT_LMS must be defined}:5180"
      - "${PORT_PLATFORM:?PORT_PLATFORM must be defined}:3006"
      - "${PORT_REGISTRAR:-5181}:5181"
      - "${PORT_SECURITY:-5182}:5182"
      - "${PORT_ADMISSIONS:-5183}:5183"
      - "${PORT_PAYMENT:-5184}:5184"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./University-ERP-Backend/ops/nginx:/tmp/nginx_config:ro
      - identity_dist:/var/www/identity-portal:ro
      - student_dist:/var/www/student-portal:ro
      - faculty_dist:/var/www/faculty-portal:ro
      - admin_dist:/var/www/admin-portal:ro
      - lms_dist:/var/www/lms-web:ro
      - finance_dist:/var/www/finance-console:ro
      - library_dist:/var/www/library-portal:ro
      - governance_dist:/var/www/governance-console:ro
      - platform_dist:/var/www/platform-console:ro
      - applicant_dist:/var/www/applicant-portal:ro
      - admissions_dist:/var/www/admissions-portal:ro
      - registrar_dist:/var/www/registrar-portal:ro
      - security_dist:/var/www/security-portal:ro
      - payment_dist:/var/www/payment-gateway:ro
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-internal

volumes:
  pgdata:
  identity_dist:
  student_dist:
  faculty_dist:
  admin_dist:
  lms_dist:
  finance_dist:
  library_dist:
  governance_dist:
  platform_dist:
  applicant_dist:
  admissions_dist:
  registrar_dist:
  security_dist:
  payment_dist:
  loki_data:
  grafana_data:
  pgbackups_local:

networks:
  erp-internal:
    driver: bridge
