x-portal-deploy: &portal-deploy
  restart: "no"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
  networks:
    - erp-internal

services:
  postgres:
    image: postgres:16-alpine
    container_name: universityerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      # Expose internally to the bridge network instead of publishing to the host
      - "5432"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-internal

  migrator:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Migrator/Dockerfile
    container_name: universityerp-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    networks:
      - erp-internal

  postgres-backup:
    build:
      context: ./University-ERP-Backend/ops/db
      dockerfile: Dockerfile.backup
    container_name: universityerp-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      APP_VERSION: ${APP_VERSION:-latest}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - pgbackups_local:/backups
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - erp-internal

  api:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Api/Dockerfile
    container_name: universityerp-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ASPNETCORE_URLS: "http://0.0.0.0:${INTERNAL_API_PORT:-5191}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PaymentGateway__SecretKey: ${PAYMENT_GATEWAY_SECRET_KEY:-sk_test_mocked}
    expose:
      - "${INTERNAL_API_PORT:-5191}"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:${INTERNAL_API_PORT:-5191}/health/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      erp-internal:
        aliases:
          - api.university.edu

  worker:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Worker/Dockerfile
    container_name: universityerp-worker
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PaymentGateway__SecretKey: ${PAYMENT_GATEWAY_SECRET_KEY:-sk_test_mocked}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - erp-internal

  frontend-builder:
    <<: *portal-deploy
    container_name: universityerp-frontend-builder
    build:
      context: ./University-ERP-Frontend
      dockerfile: Dockerfile.build-all
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY:-}
        VITE_IDENTITY_PORTAL_URL: ${VITE_IDENTITY_PORTAL_URL:-}
        VITE_STUDENT_PORTAL_URL: ${VITE_STUDENT_PORTAL_URL:-}
        VITE_APPLICANT_PORTAL_URL: ${VITE_APPLICANT_PORTAL_URL:-}
        VITE_FACULTY_PORTAL_URL: ${VITE_FACULTY_PORTAL_URL:-}
        VITE_FINANCE_CONSOLE_URL: ${VITE_FINANCE_CONSOLE_URL:-}
        VITE_GOVERNANCE_CONSOLE_URL: ${VITE_GOVERNANCE_CONSOLE_URL:-}
        VITE_ADMIN_PORTAL_URL: ${VITE_ADMIN_PORTAL_URL:-}
        VITE_LIBRARY_PORTAL_URL: ${VITE_LIBRARY_PORTAL_URL:-}
        VITE_LMS_WEB_URL: ${VITE_LMS_WEB_URL:-}
        VITE_REGISTRAR_PORTAL_URL: ${VITE_REGISTRAR_PORTAL_URL:-}
        VITE_SECURITY_PORTAL_URL: ${VITE_SECURITY_PORTAL_URL:-}
        VITE_ADMISSIONS_PORTAL_URL: ${VITE_ADMISSIONS_PORTAL_URL:-}
        VITE_PAYMENT_GATEWAY_URL: ${VITE_PAYMENT_GATEWAY_URL:-}
        VITE_PLATFORM_CONSOLE_URL: ${VITE_PLATFORM_CONSOLE_URL:-}
    volumes:
      - identity_dist:/output/identity-portal
      - student_dist:/output/student-portal
      - faculty_dist:/output/faculty-portal
      - admin_dist:/output/admin-portal
      - lms_dist:/output/lms-web
      - finance_dist:/output/finance-console
      - library_dist:/output/library-portal
      - governance_dist:/output/governance-console
      - platform_dist:/output/platform-console
      - applicant_dist:/output/applicant-portal
      - admissions_dist:/output/admissions-portal
      - registrar_dist:/output/registrar-portal
      - security_dist:/output/security-portal
      - payment_dist:/output/payment-gateway

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: universityerp-cloudflared
    restart: unless-stopped
    user: "65532:65532"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_EDGE_BIND_ADDRESS=0.0.0.0
      - TUNNEL_TRANSPORT_PROTOCOL=http2
      - TUNNEL_ORIGIN_SERVER_NAME=universityerp-nginx
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate --retries 5 --grace-period 15s run
    networks:
      - erp-internal

  alloy:
    image: grafana/alloy:v1.2.0
    container_name: universityerp-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./University-ERP-Backend/ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
    networks:
      - erp-internal
    depends_on:
      - loki

  loki:
    image: grafana/loki:2.9.2
    container_name: universityerp-loki
    restart: unless-stopped
    user: "root"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./University-ERP-Backend/ops/observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
    networks:
      - erp-internal

  grafana:
    image: grafana/grafana:11.0.0
    container_name: universityerp-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 250M
    networks:
      - erp-internal
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: universityerp-nginx
    restart: unless-stopped
    environment:
      - VITE_IDENTITY_PORTAL_URL=${VITE_IDENTITY_PORTAL_URL:-http://localhost:8081}
      - VITE_PLATFORM_CONSOLE_URL=${VITE_PLATFORM_CONSOLE_URL:-http://localhost:3006}
      - VITE_STUDENT_PORTAL_URL=${VITE_STUDENT_PORTAL_URL}
      - VITE_APPLICANT_PORTAL_URL=${VITE_APPLICANT_PORTAL_URL}
      - VITE_FACULTY_PORTAL_URL=${VITE_FACULTY_PORTAL_URL}
      - VITE_FINANCE_CONSOLE_URL=${VITE_FINANCE_CONSOLE_URL}
      - VITE_GOVERNANCE_CONSOLE_URL=${VITE_GOVERNANCE_CONSOLE_URL}
      - VITE_ADMIN_PORTAL_URL=${VITE_ADMIN_PORTAL_URL}
      - VITE_LIBRARY_PORTAL_URL=${VITE_LIBRARY_PORTAL_URL}
      - VITE_LMS_WEB_URL=${VITE_LMS_WEB_URL}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - API_INTERNAL_PORT=${INTERNAL_API_PORT:-5191}
    command:
      - /bin/sh
      - -c
      - |
        export IDENTITY_DOMAIN=$$(echo "$$VITE_IDENTITY_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export STUDENT_DOMAIN=$$(echo "$$VITE_STUDENT_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export APPLICANT_DOMAIN=$$(echo "$$VITE_APPLICANT_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export FACULTY_DOMAIN=$$(echo "$$VITE_FACULTY_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export FINANCE_DOMAIN=$$(echo "$$VITE_FINANCE_CONSOLE_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export GOVERNANCE_DOMAIN=$$(echo "$$VITE_GOVERNANCE_CONSOLE_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export ADMIN_DOMAIN=$$(echo "$$VITE_ADMIN_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export LIBRARY_DOMAIN=$$(echo "$$VITE_LIBRARY_PORTAL_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export LMS_DOMAIN=$$(echo "$$VITE_LMS_WEB_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export PLATFORM_DOMAIN=$$(echo "$$VITE_PLATFORM_CONSOLE_URL" | sed -E 's|https?://([^/]+).*|\1|')
        export PORTAL_DOMAIN=$$(echo "$$PLATFORM_DOMAIN" | sed 's/^platform/portal/')
        export API_DOMAIN=$$(echo "$$VITE_API_BASE_URL" | sed -E 's|https?://([^/]+).*|\1|')

        export IDENTITY_DOMAIN=$${IDENTITY_DOMAIN:-_}
        export STUDENT_DOMAIN=$${STUDENT_DOMAIN:-_}
        export APPLICANT_DOMAIN=$${APPLICANT_DOMAIN:-_}
        export FACULTY_DOMAIN=$${FACULTY_DOMAIN:-_}
        export FINANCE_DOMAIN=$${FINANCE_DOMAIN:-_}
        export GOVERNANCE_DOMAIN=$${GOVERNANCE_DOMAIN:-_}
        export ADMIN_DOMAIN=$${ADMIN_DOMAIN:-_}
        export LIBRARY_DOMAIN=$${LIBRARY_DOMAIN:-_}
        export LMS_DOMAIN=$${LMS_DOMAIN:-_}
        export PLATFORM_DOMAIN=$${PLATFORM_DOMAIN:-_}
        export PORTAL_DOMAIN=$${PORTAL_DOMAIN:-_}
        export API_DOMAIN=$${API_DOMAIN:-_}

        cp -r /tmp/nginx_config/* /etc/nginx/

        sed -i "s|__IDENTITY_DOMAIN__|$$IDENTITY_DOMAIN|g" /etc/nginx/sites-available/auth.university.edu.conf
        sed -i "s|__STUDENT_DOMAIN__|$$STUDENT_DOMAIN|g" /etc/nginx/sites-available/student.university.edu.conf
        sed -i "s|__APPLICANT_DOMAIN__|$$APPLICANT_DOMAIN|g" /etc/nginx/sites-available/applicant.university.edu.conf
        sed -i "s|__FACULTY_DOMAIN__|$$FACULTY_DOMAIN|g" /etc/nginx/sites-available/faculty.university.edu.conf
        sed -i "s|__FINANCE_DOMAIN__|$$FINANCE_DOMAIN|g" /etc/nginx/sites-available/finance.university.edu.conf
        sed -i "s|__GOVERNANCE_DOMAIN__|$$GOVERNANCE_DOMAIN|g" /etc/nginx/sites-available/governance.university.edu.conf
        sed -i "s|__ADMIN_DOMAIN__|$$ADMIN_DOMAIN|g" /etc/nginx/sites-available/admin.university.edu.conf
        sed -i "s|__LIBRARY_DOMAIN__|$$LIBRARY_DOMAIN|g" /etc/nginx/sites-available/library.university.edu.conf
        sed -i "s|__LMS_DOMAIN__|$$LMS_DOMAIN|g" /etc/nginx/sites-available/lms.university.edu.conf
        sed -i "s|__PLATFORM_DOMAIN__|$$PLATFORM_DOMAIN|g" /etc/nginx/sites-available/platform.university.edu.conf
        sed -i "s|__API_DOMAIN__|$$API_DOMAIN|g" /etc/nginx/sites-available/api.university.edu.conf
        sed -i "s|__PORTAL_DOMAIN__|$$PORTAL_DOMAIN|g" /etc/nginx/sites-available/portal.university.edu.conf

        sed -i "s|__API_INTERNAL_PORT__|$$API_INTERNAL_PORT|g" /etc/nginx/nginx.conf /etc/nginx/snippets/*.conf /etc/nginx/sites-available/*.conf

        export ALL_VALID_DOMAINS="$$IDENTITY_DOMAIN $$STUDENT_DOMAIN $$APPLICANT_DOMAIN $$FACULTY_DOMAIN $$FINANCE_DOMAIN $$GOVERNANCE_DOMAIN $$ADMIN_DOMAIN $$LIBRARY_DOMAIN $$LMS_DOMAIN $$PLATFORM_DOMAIN $$PORTAL_DOMAIN $$API_DOMAIN"
        sed -i "s|__ALL_VALID_DOMAINS__|$$ALL_VALID_DOMAINS|g" /etc/nginx/nginx.conf

        sed -i "s|__IDENTITY_PORTAL_URL__|$$VITE_IDENTITY_PORTAL_URL|g" /etc/nginx/snippets/auth-request.conf
        sed -i "s|__PLATFORM_CONSOLE_URL__|$$VITE_PLATFORM_CONSOLE_URL|g" /etc/nginx/sites-available/portal.university.edu.conf
        
        nginx -g "daemon off;"
    ports:
      - "${PORT_IDENTITY:?PORT_IDENTITY must be defined}:8081"
      - "${PORT_STUDENT:?PORT_STUDENT must be defined}:5173"
      - "${PORT_APPLICANT:?PORT_APPLICANT must be defined}:5174"
      - "${PORT_FACULTY:?PORT_FACULTY must be defined}:5175"
      - "${PORT_FINANCE:?PORT_FINANCE must be defined}:5176"
      - "${PORT_GOVERNANCE:?PORT_GOVERNANCE must be defined}:5177"
      - "${PORT_ADMIN:?PORT_ADMIN must be defined}:5178"
      - "${PORT_LIBRARY:?PORT_LIBRARY must be defined}:5179"
      - "${PORT_LMS:?PORT_LMS must be defined}:5180"
      - "${PORT_PLATFORM:?PORT_PLATFORM must be defined}:3006"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./University-ERP-Backend/ops/nginx:/tmp/nginx_config:ro
      - identity_dist:/var/www/identity-portal:ro
      - student_dist:/var/www/student-portal:ro
      - faculty_dist:/var/www/faculty-portal:ro
      - admin_dist:/var/www/admin-portal:ro
      - lms_dist:/var/www/lms-web:ro
      - finance_dist:/var/www/finance-console:ro
      - library_dist:/var/www/library-portal:ro
      - governance_dist:/var/www/governance-console:ro
      - platform_dist:/var/www/platform-console:ro
      - applicant_dist:/var/www/applicant-portal:ro
      - admissions_dist:/var/www/admissions-portal:ro
      - registrar_dist:/var/www/registrar-portal:ro
      - security_dist:/var/www/security-portal:ro
      - payment_dist:/var/www/payment-gateway:ro
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-internal

volumes:
  pgdata:
  identity_dist:
  student_dist:
  faculty_dist:
  admin_dist:
  lms_dist:
  finance_dist:
  library_dist:
  governance_dist:
  platform_dist:
  applicant_dist:
  admissions_dist:
  registrar_dist:
  security_dist:
  payment_dist:
  loki_data:
  grafana_data:
  pgbackups_local:

networks:
  erp-internal:
    driver: bridge
