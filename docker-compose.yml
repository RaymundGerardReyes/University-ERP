services:
  postgres:
    image: postgres:16-alpine
    container_name: universityerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-internal

  migrator:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Migrator/Dockerfile
    container_name: universityerp-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Uses internal Docker network hostname 'postgres' and internal port 5432.
      # DB_HOST/DB_PORT are ONLY for external access (DBeaver/pgAdmin from Windows).
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    networks:
      - erp-internal

  api:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Api/Dockerfile
    container_name: universityerp-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5191"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    expose:
      - "5191"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - erp-internal

  worker:
    build:
      context: ./University-ERP-Backend
      dockerfile: src/Bootstrap/UniversityErp.Worker/Dockerfile
    container_name: universityerp-worker
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    networks:
      - erp-internal

  frontend-builder:
    build:
      context: ./University-ERP-Frontend
      dockerfile: Dockerfile.build-all
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY}
        VITE_IDENTITY_PORTAL_URL: ${VITE_IDENTITY_PORTAL_URL}
    container_name: universityerp-frontend-builder
    restart: "no"
    volumes:
      - identity_dist:/output/identity-portal
      - student_dist:/output/student-portal
      - faculty_dist:/output/faculty-portal
      - admin_dist:/output/admin-portal
      - lms_dist:/output/lms-web
      - finance_dist:/output/finance-console
      - library_dist:/output/library-portal
      - governance_dist:/output/governance-console
      - platform_dist:/output/platform-console
      - applicant_dist:/output/applicant-portal
    networks:
      - erp-internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: universityerp-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./University-ERP-Backend/ops/cloudflare/tunnel/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - nginx
    networks:
      - erp-internal

  nginx:
    image: nginx:alpine
    container_name: universityerp-nginx
    restart: unless-stopped
    # Local Development Override: Map port 8080 to Nginx port 80
    # In pure Zero Trust production, this 'ports' block is removed.
    ports:
      - "8080:80"
      - "8081:8081"
    volumes:
      - ./University-ERP-Backend/ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./University-ERP-Backend/ops/nginx/sites-available:/etc/nginx/sites-available:ro
      - ./University-ERP-Backend/ops/nginx/snippets:/etc/nginx/snippets:ro
      - identity_dist:/var/www/identity-portal:ro
      - student_dist:/var/www/student-portal:ro
      - faculty_dist:/var/www/faculty-portal:ro
      - admin_dist:/var/www/admin-portal:ro
      - lms_dist:/var/www/lms-web:ro
      - finance_dist:/var/www/finance-console:ro
      - library_dist:/var/www/library-portal:ro
      - governance_dist:/var/www/governance-console:ro
      - platform_dist:/var/www/platform-console:ro
      - applicant_dist:/var/www/applicant-portal:ro
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      api:
        # Wait for API health check to pass before nginx routes traffic to it.
        # Prevents 502 Bad Gateway errors during the API warm-up window.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-internal

volumes:
  pgdata:
  identity_dist:
  student_dist:
  faculty_dist:
  admin_dist:
  lms_dist:
  finance_dist:
  library_dist:
  governance_dist:
  platform_dist:
  applicant_dist:

networks:
  erp-internal:
    driver: bridge
