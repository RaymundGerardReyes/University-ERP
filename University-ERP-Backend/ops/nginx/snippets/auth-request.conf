# -----------------------------------------------------------------------------
# Gateway-Level Authorization Snippet
# -----------------------------------------------------------------------------
# This file is used to enforce authorization on static files.
# It sends a subrequest to the backend API.
# If the backend returns 200 OK, the static file is served.
# If the backend returns 401/403, the request is denied.

auth_request /_oauth2_token_introspection;

# The subrequest endpoint
location = /_oauth2_token_introspection {
    internal;
    set $api_upstream universityerp-api:5191;
    proxy_pass http://$api_upstream/api/v1/platform/identity/validate;
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    # Pass the original URI so the backend knows which portal is being requested
    proxy_set_header X-Original-URI $request_uri;
    
    # Pass the explicit portal target defined in the server block
    proxy_set_header X-Portal-Target $portal_target;
    
    # Pass headers/cookies to ensure the token is forwarded
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
}

# Define what happens on 401 Unauthorized
error_page 401 = @error401;
location @error401 {
    return 302 https://identity-portal.mydomain.dev;
}

# Define what happens on 403 Forbidden
error_page 403 = @error403;
location @error403 {
    return 403 "Access Denied: You do not have the required role to access this portal.";
}
