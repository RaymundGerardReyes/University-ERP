worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ──────────────────────────────────────────────────
  # Gzip Compression
  # ──────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Rate Limiting Zones
  # ──────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_auth_strict:10m rate=1r/s;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Security Headers
  # ──────────────────────────────────────────────────
  # Security Headers are managed in snippets/security-headers.conf to prevent 
  # inheritance wiping when local add_header directives are used in server blocks.

  server_tokens off;
  client_max_body_size 10m;

  # ──────────────────────────────────────────────────
  # Cloudflare Real IP Handling
  # ──────────────────────────────────────────────────
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Cloudflare IPv4 ranges
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;

  # Cloudflare IPv6 ranges
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  # ──────────────────────────────────────────────────
  # Observability / Logging
  # ──────────────────────────────────────────────────
  log_format structured
    'client_ip=$remote_addr '
    'cf_ip=$http_cf_connecting_ip '
    'xff="$http_x_forwarded_for" '
    'request="$request" '
    'status=$status '
    'request_time=$request_time '
    'upstream_status=$upstream_status '
    'upstream_response_time=$upstream_response_time '
    'correlation_id="$http_x_correlation_id" '
    'cf_ray="$http_cf_ray"';

  access_log /var/log/nginx/access.log structured;
  error_log  /var/log/nginx/error.log  warn;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ──────────────────────────────────────────────────
  # Upstream Resilience
  # Dynamic resolution is used instead of static upstream blocks to handle Docker IP changes
  # ──────────────────────────────────────────────────

  # ──────────────────────────────────────────────────
  # WebSocket Connection Upgrade Map
  # ──────────────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
  }

  server {
    listen 80;
    listen [::]:80 ipv6only=on;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /var/www;
    index index.html;

    # Global proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ──────────────────────────────────────────────
    # Auth endpoints — strict rate limit (brute-force)
    # ──────────────────────────────────────────────
    location /api/auth/reset/ {
      limit_req zone=api_auth_strict burst=2 nodelay;
      limit_req_status 429;
      set $api_upstream universityerp-api:5191;
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   CF-Ray            $http_cf_ray;
    }

    location /api/auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      limit_req_status 429;
      set $api_upstream universityerp-api:5191;
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   CF-Ray            $http_cf_ray;
    }

    location /api/v1/finance/ {
        set $api_upstream universityerp-api:5191;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
    }

    # ──────────────────────────────────────────────
    # General API — standard rate limit
    # ──────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_general burst=40 nodelay;
      limit_req_status 429;
      set $api_upstream universityerp-api:5191;
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   CF-Ray            $http_cf_ray;
    }

    # ──────────────────────────────────────────────
    # SignalR hub — WebSocket support
    # ──────────────────────────────────────────────
    location /hubs/ {
      set $api_upstream universityerp-api:5191;
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   CF-Ray            $http_cf_ray;
      proxy_read_timeout 3600s;
    }

    # ──────────────────────────────────────────────
    # Dynamic Frontend App Routing
    # ──────────────────────────────────────────────
    location ~ ^/(admin-portal|admissions-portal|applicant-portal|faculty-portal|finance-console|governance-console|library-portal|lms-web|platform-console|registrar-portal|security-portal|student-portal) {
      try_files $uri $uri/ /$1/index.html;
    }

    # Handle frontend assets requested at the root level (e.g. /assets/...) due to Vite base path issue
    location /assets/ {
      root /var/www;
      try_files /student-portal$uri /applicant-portal$uri /admin-portal$uri /faculty-portal$uri /finance-console$uri /governance-console$uri /identity-portal$uri /library-portal$uri /lms-web$uri /platform-console$uri /registrar-portal$uri /security-portal$uri /admissions-portal$uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Handle common root-level static files requested by browsers or Vite
    location ~ ^/(vite\.svg|favicon\.ico|manifest\.json)$ {
      root /var/www;
      try_files /student-portal$uri /applicant-portal$uri /admin-portal$uri /faculty-portal$uri /finance-console$uri /governance-console$uri /identity-portal$uri /library-portal$uri /lms-web$uri /platform-console$uri /registrar-portal$uri /security-portal$uri /admissions-portal$uri =404;
    }

    location = / {
      return 302 /student-portal;
    }

    # Redirect stray requests for Identity Portal to its dedicated port
    location ^~ /identity-portal {
      return 301 http://localhost:8081/login;
    }

    # ──────────────────────────────────────────────
    # Health checks
    # ──────────────────────────────────────────────
    location /health/live {
      set $api_upstream universityerp-api:5191;
      proxy_pass http://$api_upstream/health/live;
      proxy_set_header Host $http_host;
    }

    location /health/ready {
      set $api_upstream universityerp-api:5191;
      proxy_pass http://$api_upstream/health/ready;
      proxy_set_header Host $http_host;
    }
  }

  include /etc/nginx/sites-available/*.conf;
}
