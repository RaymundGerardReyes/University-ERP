# ─────────────────────────────────────────────────────────────────────────────
# Local Development – Default Server (catch-all for "localhost")
# This block handles requests where Host: localhost (i.e. when no real domain
# is configured). In production, Cloudflare routes by subdomain and this file
# is not needed.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name localhost _;

    # ── /api/* → API service ──────────────────────────────────────────────
    location /api/ {
        set $api_upstream api:5191;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── / → Student Portal (default landing) ──────────────────────────────
    location / {
        root /var/www/student-portal;
        try_files $uri $uri/ /index.html;
    }
}
