server {
    listen 443 ssl;
    server_name api.university.edu;

    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;

    ssl_certificate     /etc/nginx/ssl/api.university.edu.crt;
    ssl_certificate_key /etc/nginx/ssl/api.university.edu.key;

    location / {
        proxy_pass http://127.0.0.1:5000;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    server_name api.university.edu;
    return 301 https://$host$request_uri;
}
