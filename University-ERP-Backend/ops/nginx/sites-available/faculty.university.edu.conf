server {
    listen 80;
    server_name faculty.university.edu;

    # Apply enterprise security and rate-limiting standards
    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;

    # Path where the CI/CD pipeline deploys the built React assets
    root /var/www/faculty-portal;
    index index.html;

    # SPA Routing: Fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for performance
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy API calls directly to the C# Backend Gateway
    location /api/ {
        set $api_upstream universityerp-api:5191;
        proxy_pass http://$api_upstream;
        include snippets/proxy-common.conf;
    }
}
