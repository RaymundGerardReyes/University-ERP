server {
    listen 80;
    listen 5174;
    server_name __APPLICANT_DOMAIN__;

    # Apply enterprise security and rate-limiting standards
    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;

    root /var/www/applicant-portal;
    index index.html;

    location / {
        # Explicitly declare the portal identity for the authorization gateway
        set $portal_target "Applicant";
        
        # Enforce gateway-level authorization before serving static assets
        include snippets/auth-request.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|svg|png|gif|ico|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        set $api_upstream universityerp-api:__API_INTERNAL_PORT__;
        proxy_pass http://$api_upstream;
        include snippets/proxy-common.conf;
    }
}
