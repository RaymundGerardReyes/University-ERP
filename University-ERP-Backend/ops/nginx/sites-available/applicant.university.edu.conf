server {
    listen 80;
    server_name applicant.university.edu;

    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;

    root /var/www/applicant-portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|svg|png|gif|ico|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        set $api_upstream universityerp-api:5191;
        proxy_pass http://$api_upstream;
        include snippets/proxy-common.conf;
    }
}
