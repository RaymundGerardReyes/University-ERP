# ─────────────────────────────────────────────────────────────────────────────
# Local Development – Identity Portal
# Serves the Identity Portal locally on port 8081. In production, this is
# served under auth.university.edu and handled by Cloudflare routing.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8081;
    server_name localhost _;

    # ── /api/* → API service ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── / → Identity Portal ──────────────────────────────────────────────
    location / {
        root /var/www/identity-portal;
        try_files $uri $uri/ /index.html;
    }
}
