server {
    listen 80;
    listen 5178;
    server_name __ADMIN_DOMAIN__;
    root /var/www/admin-portal;

    include snippets/security-headers.conf;
    location / {
        # Explicitly declare the portal identity for the authorization gateway
        set $portal_target "Admin";
        
        # Enforce gateway-level authorization before serving static assets
        include snippets/auth-request.conf;
        try_files $uri $uri/ /index.html;
    }
}
