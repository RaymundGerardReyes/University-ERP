name: Build React Portals
on:
  push:
    paths:
      - 'University-ERP-Frontend/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: University-ERP-Frontend
      - run: npm run build --workspaces
        working-directory: University-ERP-Frontend
