name: Build Platform Modules
on:
  push:
    paths:
      - 'University-ERP-Backend/src/Modules/Platform/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build University-ERP-Backend/src/Bootstrap/UniversityErp.Api/UniversityErp.Api.csproj
