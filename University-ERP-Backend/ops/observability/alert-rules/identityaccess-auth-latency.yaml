groups:
  - name: identity-alerts
    rules:
      - alert: HighAuthLatency
        expr: histogram_quantile(0.95, sum(rate(identity_auth_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Authentication Latency"
          description: "95th percentile authentication latency is > 1s for the last 5 minutes."
